name: Software Composition Analysis

on:
  push:
    branches:
      - "**"

jobs:
  software-composition-analysis:
    runs-on: ubuntu-latest
    name: Datadog SBOM Generation and Upload
    permissions:
      contents: read # Needed by actions/checkout to read repository contents
      id-token: write # Needed to federate tokens
    steps:
    - name: Get Datadog credentials
      id: dd-sts
      uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
      with:
        policy: datadog-static-analyzer
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: ./.github/actions/set-up-rust
    - name: cargo install sbom-attest
      run: cargo install --locked --version 0.2.0 sbom-attest
      env:
        # a one-off build: skip the crate's LTO release profile to install faster
        CARGO_PROFILE_RELEASE_LTO: "false"
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    - name: cargo generate sbom
      run: |
        for pkg in static-analysis-kernel datadog-static-analyzer cli static-analysis-server; do
          sbom-attest generate --locked --package "$pkg" --cdx "$pkg.cdx.json"
        done
    - name: Upload CycloneDX SBOMs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: cyclonedx-sbom
        path: "*.cdx.json"
        if-no-files-found: error
    - name: Generate SBOM and Upload
      id: software-composition-analysis
      uses: DataDog/datadog-sca-github-action@2cc1486ee1b07318ba608b86e40d124efa76ddb5 # main
      with:
        dd_api_key: ${{ steps.dd-sts.outputs.api_key }}
        dd_app_key: ${{ steps.dd-sts.outputs.app_key }}
        dd_site: ${{ vars.DD_SITE }}

